## Un seul conteneur, comme sur Render : l'API sert aussi le site exporté.
services:
  bizia:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "*"
      PYTHONPATH: /repo
      DATA_DIR: /repo/data
      UPLOAD_DIR: /repo/data/uploads
      DATABASE_PATH: /repo/data/local/bizia.json
    volumes:
      - ./data:/repo/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
