# Déploiement Render : un seul service qui sert le site et l'API.
# New → Blueprint → ce dépôt → branche `dev`.
services:
  - type: web
    name: bizia
    runtime: docker
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: data/local/bizia.json
      - key: LLM_PROVIDER
        value: none
